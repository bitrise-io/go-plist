format_version: "10"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

trigger_map:
- push_branch: "*"
  workflow: primary
- pull_request_source_branch: "*"
  workflow: primary

meta:
  bitrise.io:
    stack: ubuntu-latest-stable
    machine_type_id: g2.linux.medium

workflows:
  primary:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@4: {}
    - script@1:
        title: Do anything with Script step
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            bitrise run ci
    - deploy-to-bitrise-io@2: {}

  ci:
    before_run:
      - test

  test:
    steps:
    - go-test:
        inputs:
        - packages: github.com/bitrise-io/go-plist
